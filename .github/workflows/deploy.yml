name: Deploy
run-name: Deploy for ${{ github.repository }}/merger-api.

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build_and_push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate image tag
        id: meta
        run: |
          SHA_TAG="sha-${{ github.event.workflow_run.head_sha }}"
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./merger-api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pdf-merger:latest
            ghcr.io/${{ github.repository_owner }}/pdf-merger:sha-${{ github.event.workflow_run.head_sha }}

  deploy_test:
    name: Deploy to test
    runs-on: ubuntu-latest
    needs: build_and_push
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform plan
        working-directory: infra/terraform
        run: |
          terraform plan \
            -var="image_tag=${{ needs.build_and_push.outputs.image_tag }}" \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="cors_allowed_origins=[\"http://localhost:5173\"]" \
            -var="rate_limit=100/minute" \
            -var="environment=test"

      - name: Terraform apply
        working-directory: infra/terraform
        run: |
          terraform apply -auto-approve \
            -var="image_tag=${{ needs.build_and_push.outputs.image_tag }}" \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="cors_allowed_origins=[\"http://localhost:5173\"]" \
            -var="rate_limit=100/minute" \
            -var="environment=test"
