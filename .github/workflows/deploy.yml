name: Deploy
run-name: Deploy for ${{ github.repository }}/merger-api.

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  release:
    types:
      - published

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build_and_push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate image tag
        id: meta
        run: |
          SHA_TAG="sha-${{ github.event.workflow_run.head_sha }}"
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./merger-api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pdf-merger:latest
            ghcr.io/${{ github.repository_owner }}/pdf-merger:sha-${{ github.event.workflow_run.head_sha }}

  deploy_test:
    name: Deploy to test
    runs-on: ubuntu-latest
    needs: build_and_push
    environment: test
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Write tfvars
        run: |
          cat > ci.tfvars <<EOF
          subscription_id      = "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          image_tag            = "${{ needs.build_and_push.outputs.image_tag }}"
          cors_allowed_origins = "${{ secrets.CORS_ALLOWED_ORIGINS }}"
          rate_limit           = "${{ secrets.RATE_LIMIT }}"
          environment          = "${{ vars.ENVIRONMENT }}"
          EOF

      - name: Terraform init
        run: terraform init -backend-config="key=pdf-merger-test.tfstate"

      - name: Terraform plan
        run: terraform plan -var-file=ci.tfvars

      - name: Terraform apply
        run: terraform apply -auto-approve -var-file=ci.tfvars

  cleanup:
    name: Cleanup old images
    runs-on: ubuntu-latest
    needs: deploy_test
    permissions:
      packages: write

    steps:
      - name: Delete old package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: pdf-merger
          package-type: container
          min-versions-to-keep: 1
          ignore-versions: "^(latest|v.*)$"

  tag_release_image:
    name: Tag release image
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag latest as release version
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/pdf-merger:latest
          docker tag ghcr.io/${{ github.repository_owner }}/pdf-merger:latest \
            ghcr.io/${{ github.repository_owner }}/pdf-merger:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository_owner }}/pdf-merger:${{ github.ref_name }}

  deploy_prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: tag_release_image
    environment: prod
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Write tfvars
        run: |
          cat > ci.tfvars <<EOF
          subscription_id      = "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          image_tag            = "${{ github.ref_name }}"
          cors_allowed_origins = "${{ secrets.CORS_ALLOWED_ORIGINS }}"
          rate_limit           = "${{ secrets.RATE_LIMIT }}"
          environment          = "${{ vars.ENVIRONMENT }}"
          EOF

      - name: Terraform init
        run: terraform init -backend-config="key=pdf-merger-prod.tfstate"

      - name: Terraform plan
        run: terraform plan -var-file=ci.tfvars

      - name: Terraform apply
        run: terraform apply -auto-approve -var-file=ci.tfvars 
