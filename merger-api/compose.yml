services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REQUIRE_ENV: dev
    ports:
      - 8000:8000
      - 5678:5678
    command: python -m debugpy --listen 0.0.0.0:5678 -m uvicorn app.main:app --host=0.0.0.0 --port=8000 --reload
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
    env_file: .env
